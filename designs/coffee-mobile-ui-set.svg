<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cute coffee ordering mobile UI design set</title>
  <desc id="desc">Four light yellow and brown mobile app screens: order coffee, coffee list, order list, and order status, with cute stick figures and vector linear icons.</desc>
  <defs>
    <style>
      :root {
        --cream: #fff7cf;
        --cream-2: #ffe9a8;
        --latte: #e6c17a;
        --caramel: #b7793e;
        --coffee: #6a3f28;
        --espresso: #3b2419;
        --milk: #fffdf2;
        --mint: #a8d8a7;
        --rose: #f4a6a6;
      }
      .bg { fill: #fff2bd; }
      .bean-bg { fill: none; stroke: #e3bf7b; stroke-width: 5; stroke-linecap: round; opacity: .45; }
      .phone { fill: var(--milk); stroke: var(--coffee); stroke-width: 6; }
      .screen { fill: var(--cream); }
      .top-pill { fill: var(--coffee); opacity: .9; }
      .title { font: 700 34px/1.1 Inter, Nunito, Arial, sans-serif; fill: var(--espresso); }
      .label { font: 700 20px/1.2 Inter, Nunito, Arial, sans-serif; fill: var(--coffee); }
      .small { font: 500 15px/1.2 Inter, Nunito, Arial, sans-serif; fill: var(--caramel); }
      .price { font: 800 24px/1.2 Inter, Nunito, Arial, sans-serif; fill: var(--espresso); }
      .line { fill: none; stroke: var(--coffee); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--coffee); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: #ffe7ad; stroke: var(--coffee); stroke-width: 4; }
      .card { fill: #fffdf2; stroke: #d99d58; stroke-width: 3; }
      .button { fill: var(--coffee); }
      .button-text { font: 800 18px Inter, Nunito, Arial, sans-serif; fill: #fff8d8; }
      .chip { fill: #f6d98d; stroke: var(--coffee); stroke-width: 3; }
      .tab { fill: #fff8da; stroke: #d99d58; stroke-width: 3; }
      .shadow { fill: #c98a4a; opacity: .16; }
    </style>
    <symbol id="bean" viewBox="0 0 40 58">
      <path class="bean-bg" d="M20 4C7 10 2 26 8 42c5 13 18 17 25 8 8-10 5-30-5-42-2-3-5-4-8-4Z"/>
      <path class="bean-bg" d="M23 8c-8 11-9 25-1 41"/>
    </symbol>
    <symbol id="cup" viewBox="0 0 120 120">
      <path class="line" d="M26 46h57l-7 42H34L26 46Z"/>
      <path class="line" d="M83 55h12c9 0 11 24-4 25H79"/>
      <path class="thin" d="M40 34c-8-9 8-13 1-23"/>
      <path class="thin" d="M59 34c-8-9 8-13 1-23"/>
      <path class="thin" d="M78 34c-8-9 8-13 1-23"/>
      <path class="line" d="M25 96h61"/>
    </symbol>
    <symbol id="stick" viewBox="0 0 100 120">
      <circle class="thin" cx="50" cy="24" r="16"/>
      <path class="thin" d="M50 40v38M50 53 27 66M50 53l24-14M50 78 30 25M50 78l-28 24"/>
      <path class="thin" d="M42 22h1M58 22h1M43 31c6 5 11 5 17 0"/>
    </symbol>
    <symbol id="bag" viewBox="0 0 90 90">
      <path class="line" d="M23 31h44l6 47H17l6-47Z"/>
      <path class="thin" d="M34 31c0-18 22-18 22 0"/>
      <path class="thin" d="M34 48h22"/>
    </symbol>
    <symbol id="clock" viewBox="0 0 90 90">
      <circle class="line" cx="45" cy="45" r="31"/>
      <path class="thin" d="M45 25v22l16 9"/>
    </symbol>
    <symbol id="search" viewBox="0 0 80 80">
      <circle class="thin" cx="34" cy="34" r="20"/>
      <path class="line" d="M50 50 66 66"/>
    </symbol>
  </defs>

  <rect class="bg" width="1600" height="1000" rx="48"/>
  <use href="#bean" x="54" y="60" width="70" height="100"/>
  <use href="#bean" x="1460" y="80" width="70" height="100" transform="rotate(14 1495 130)"/>
  <use href="#bean" x="104" y="820" width="74" height="106" transform="rotate(-18 141 873)"/>
  <use href="#bean" x="1420" y="790" width="76" height="110"/>
  <path class="bean-bg" d="M276 99c95-55 189-62 282-21M1030 909c106 42 210 34 309-23"/>
  <text class="title" x="90" y="88">Coffee Buddy UI Kit</text>
  <text class="small" x="92" y="122">light yellow + brown · cute stick figures · vector linear icon style</text>

  <!-- Phone 1: Order coffee page -->
  <g transform="translate(80 160)">
    <rect class="shadow" x="18" y="20" width="300" height="674" rx="48"/>
    <rect class="phone" width="300" height="674" rx="48"/>
    <rect class="screen" x="18" y="56" width="264" height="578" rx="28"/>
    <rect class="top-pill" x="112" y="24" width="76" height="10" rx="5"/>
    <text class="title" x="38" y="108">Order Coffee</text>
    <text class="small" x="40" y="136">Make today sweet ☕</text>
    <circle class="soft" cx="150" cy="228" r="86"/>
    <use href="#cup" x="88" y="160" width="126" height="126"/>
    <use href="#stick" x="185" y="186" width="72" height="88"/>
    <rect class="card" x="40" y="338" width="220" height="80" rx="24"/>
    <text class="label" x="62" y="371">Caramel Latte</text>
    <text class="small" x="62" y="395">oat milk · warm foam</text>
    <text class="price" x="196" y="391">$4.8</text>
    <text class="label" x="44" y="462">Size</text>
    <rect class="chip" x="42" y="484" width="58" height="48" rx="18"/>
    <text class="label" x="62" y="516">S</text>
    <rect class="chip" x="120" y="484" width="58" height="48" rx="18" style="fill:#6a3f28"/>
    <text class="button-text" x="140" y="516">M</text>
    <rect class="chip" x="198" y="484" width="58" height="48" rx="18"/>
    <text class="label" x="218" y="516">L</text>
    <rect class="button" x="40" y="566" width="220" height="56" rx="22"/>
    <text class="button-text" x="94" y="601">Add to order</text>
  </g>

  <!-- Phone 2: Coffee list page -->
  <g transform="translate(460 160)">
    <rect class="shadow" x="18" y="20" width="300" height="674" rx="48"/>
    <rect class="phone" width="300" height="674" rx="48"/>
    <rect class="screen" x="18" y="56" width="264" height="578" rx="28"/>
    <rect class="top-pill" x="112" y="24" width="76" height="10" rx="5"/>
    <text class="title" x="38" y="108">Coffee List</text>
    <rect class="card" x="38" y="134" width="224" height="48" rx="20"/>
    <use href="#search" x="48" y="140" width="36" height="36"/>
    <text class="small" x="90" y="164">Search beans</text>
    <rect class="chip" x="38" y="206" width="76" height="40" rx="18" style="fill:#6a3f28"/>
    <text class="button-text" x="56" y="232">Hot</text>
    <rect class="chip" x="126" y="206" width="76" height="40" rx="18"/>
    <text class="label" x="145" y="232">Iced</text>
    <rect class="chip" x="214" y="206" width="48" height="40" rx="18"/>
    <text class="label" x="228" y="232">+</text>
    <g transform="translate(38 272)">
      <rect class="card" width="224" height="96" rx="26"/>
      <circle class="soft" cx="52" cy="48" r="34"/>
      <use href="#cup" x="22" y="18" width="62" height="62"/>
      <text class="label" x="96" y="39">Honey Flat</text>
      <text class="small" x="96" y="64">soft + creamy</text>
      <text class="price" x="96" y="88">$5.2</text>
    </g>
    <g transform="translate(38 392)">
      <rect class="card" width="224" height="96" rx="26"/>
      <circle class="soft" cx="52" cy="48" r="34" style="fill:#f3c98a"/>
      <use href="#cup" x="22" y="18" width="62" height="62"/>
      <text class="label" x="96" y="39">Mocha Hug</text>
      <text class="small" x="96" y="64">cocoa cloud</text>
      <text class="price" x="96" y="88">$5.6</text>
    </g>
    <g transform="translate(38 512)">
      <rect class="card" width="224" height="96" rx="26"/>
      <circle class="soft" cx="52" cy="48" r="34" style="fill:#dcb078"/>
      <use href="#cup" x="22" y="18" width="62" height="62"/>
      <text class="label" x="96" y="39">Tiny Espresso</text>
      <text class="small" x="96" y="64">bold little sip</text>
      <text class="price" x="96" y="88">$3.4</text>
    </g>
  </g>

  <!-- Phone 3: Order list page -->
  <g transform="translate(840 160)">
    <rect class="shadow" x="18" y="20" width="300" height="674" rx="48"/>
    <rect class="phone" width="300" height="674" rx="48"/>
    <rect class="screen" x="18" y="56" width="264" height="578" rx="28"/>
    <rect class="top-pill" x="112" y="24" width="76" height="10" rx="5"/>
    <text class="title" x="38" y="108">Order List</text>
    <text class="small" x="40" y="136">3 happy drinks waiting</text>
    <g transform="translate(38 170)">
      <rect class="card" width="224" height="86" rx="24"/>
      <use href="#cup" x="14" y="14" width="58" height="58"/>
      <text class="label" x="82" y="36">Caramel Latte</text>
      <text class="small" x="82" y="60">M · oat milk</text>
      <text class="price" x="178" y="60">×1</text>
    </g>
    <g transform="translate(38 280)">
      <rect class="card" width="224" height="86" rx="24"/>
      <use href="#cup" x="14" y="14" width="58" height="58"/>
      <text class="label" x="82" y="36">Mocha Hug</text>
      <text class="small" x="82" y="60">S · extra cocoa</text>
      <text class="price" x="178" y="60">×2</text>
    </g>
    <g transform="translate(38 390)">
      <rect class="card" width="224" height="86" rx="24"/>
      <use href="#bag" x="18" y="12" width="62" height="62"/>
      <text class="label" x="82" y="36">Cookie bag</text>
      <text class="small" x="82" y="60">butter bear</text>
      <text class="price" x="178" y="60">×1</text>
    </g>
    <path class="thin" d="M52 515h196"/>
    <text class="label" x="52" y="550">Total</text>
    <text class="price" x="184" y="550">$18.1</text>
    <rect class="button" x="40" y="586" width="220" height="46" rx="20"/>
    <text class="button-text" x="92" y="615">Checkout</text>
  </g>

  <!-- Phone 4: Order status page -->
  <g transform="translate(1220 160)">
    <rect class="shadow" x="18" y="20" width="300" height="674" rx="48"/>
    <rect class="phone" width="300" height="674" rx="48"/>
    <rect class="screen" x="18" y="56" width="264" height="578" rx="28"/>
    <rect class="top-pill" x="112" y="24" width="76" height="10" rx="5"/>
    <text class="title" x="38" y="108">Order Status</text>
    <text class="small" x="40" y="136">Your cup is on a tiny trip</text>
    <circle class="soft" cx="150" cy="226" r="76"/>
    <use href="#clock" x="102" y="178" width="96" height="96"/>
    <use href="#stick" x="174" y="220" width="70" height="82"/>
    <text class="label" x="78" y="344">Ready in 8 min</text>
    <g transform="translate(54 386)">
      <circle class="chip" cx="22" cy="22" r="20" style="fill:#6a3f28"/>
      <path class="thin" d="M14 22l6 6 12-14" style="stroke:#fff8d8"/>
      <text class="label" x="58" y="29">Order received</text>
      <path class="thin" d="M22 44v42"/>
      <circle class="chip" cx="22" cy="106" r="20" style="fill:#6a3f28"/>
      <path class="thin" d="M14 106l6 6 12-14" style="stroke:#fff8d8"/>
      <text class="label" x="58" y="113">Brewing</text>
      <path class="thin" d="M22 128v42"/>
      <circle class="chip" cx="22" cy="190" r="20"/>
      <text class="label" x="58" y="197">Pickup soon</text>
    </g>
    <rect class="tab" x="42" y="586" width="216" height="46" rx="20"/>
    <text class="label" x="83" y="615">Track my coffee</text>
  </g>
</svg>
